name: Validate final GNSS time sync

on:
  push:
    branches:
      - fix/vault-final-flight-readiness-20260816
    paths:
      - .github/workflows/validate-final-time-sync.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vault-final-flight-readiness-20260816
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88.0'
          components: rustfmt
      - name: Avoid compiler-version-specific integer helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/gnss/nmea.rs')
          s = p.read_text()
          old = 'year.is_multiple_of(4) && (!year.is_multiple_of(100) || year.is_multiple_of(400))'
          new = 'year % 4 == 0 && (year % 100 != 0 || year % 400 == 0)'
          if s.count(old) != 1:
              raise SystemExit(f'expected leap-year expression once, got {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - run: cargo fmt --all
      - run: cargo test --lib
      - run: git diff --check
      - name: Commit formatting and compatibility fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/gnss/nmea.rs src/gnss/mod.rs src/state.rs src/tasks/gnss_task.rs src/tasks/can_communication.rs
          git rm .github/workflows/validate-final-time-sync.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test(comboard): validate GNSS absolute time"
          git push origin HEAD:fix/vault-final-flight-readiness-20260816
