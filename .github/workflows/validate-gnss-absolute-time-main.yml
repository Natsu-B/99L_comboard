name: Validate GNSS absolute time main

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-gnss-absolute-time-main.yml

permissions:
  contents: write

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Format changed Rust files
        run: |
          rustfmt +stable --edition 2024 \
            src/gnss/time.rs src/gnss/mod.rs src/state.rs \
            src/tasks/gnss_task.rs src/tasks/mod.rs src/bin/main.rs
          git diff --check
      - name: Run host library tests
        run: cargo +stable test --lib
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "hotaru"
          git config user.email "69021496+Natsu-B@users.noreply.github.com"
          git add src/gnss/time.rs src/gnss/mod.rs src/state.rs src/tasks/gnss_task.rs src/tasks/mod.rs src/bin/main.rs
          git commit -m "style(comboard): format GNSS time changes"
          git push origin HEAD:main
