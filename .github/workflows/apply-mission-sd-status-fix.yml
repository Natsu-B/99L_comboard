name: Apply Mission SD status fix

on:
  push:
    branches: [main]
    paths:
      - tools/apply_mission_sd_health_fix.py
      - .github/workflows/apply-mission-sd-status-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync main
        run: git pull --rebase origin main
      - name: Apply targeted fix
        run: python3 tools/apply_mission_sd_health_fix.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt -- --check
      - name: Test
        run: cargo test
      - name: Commit verified fix
        run: |
          rm -f tools/apply_mission_sd_health_fix.py
          rm -f .github/workflows/apply-mission-sd-status-fix.yml
          git diff --check
          git config user.name "hotaru"
          git config user.email "69021496+Natsu-B@users.noreply.github.com"
          git add src/can/protocol.rs src/tasks/lora_task_base.rs \
                  testdata/99l_protocol_golden_vectors.txt \
                  tools/apply_mission_sd_health_fix.py \
                  .github/workflows/apply-mission-sd-status-fix.yml
          git commit -m "fix(comboard): report Mission SD health"
          git pull --rebase origin main
          git push origin HEAD:main
